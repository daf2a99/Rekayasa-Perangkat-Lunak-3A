<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Admin — Benerin Donk...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="pemimpin.css" />
    <link rel="icon" type="image/png" href="../logoBG.png" />
  </head>

  <body class="light">
    <header>
      <div class="logo">
        <img src="../logo.png" alt="Logo Benerin Donk" />
        <span>Benerin<span class="accent"> Donk...</span></span>
      </div>

      <button class="theme-toggle" id="theme-btn" type="button" aria-label="Ganti tema terang atau gelap">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
        </svg>
      </button>
      
    </header>

    <main>
      <div class="card login-card">
        <!-- card utama -->
        <div class="login-header">
          <span class="login-icon" aria-hidden="true">
            <img src="../logo.png" alt="Logo Benerin Donk"/>
          </span>

          <h1 class="card-title">Portal Pemimpin</h1>
          <p class="card-sub">Masuk untuk melihat kinerja perbaikan.</p>

        </div>

        <!--
          FORM LOGIN
          - Dibungkus <form> supaya tombol Enter otomatis mengirim form.
          - novalidate: validasi kolom kosong ditangani admin.js agar pesannya seragam.
          - Pengiriman form ditangani di admin.js (event "submit").
        -->

        <form id="login-form" novalidate>
          <div class="field">
            <label for="login-user">Username</label>
            <input
              type="text"
              id="login-user"
              class="form-input"
              placeholder="Masukkan username"
              autocomplete="username"
              required
            />
          </div>

          <div class="field">
            <label for="login-pass">Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="login-pass"
                class="form-input"
                placeholder="Masukkan password"
                autocomplete="current-password"
                required/>

              <!-- Tombol mata (admin.js) -->

              <button
                    type="button"
                    id="toggle-pass"
                    class="toggle-password"
                    aria-label="Tampilkan password"
                    aria-pressed="false">

                    <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                    <circle cx="12" cy="12" r="3" />
                    </svg>
                    <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                    <path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                    <path d="M2 2l20 20" />
                    </svg>
              </button>
            </div>
          </div>

          <!-- Tempat pesan error (kolom kosong, password salah, dll). Diisi oleh admin.js -->
          <p class="form-error" id="login-error" role="alert" hidden></p>

          <button type="submit" class="btn btn-primary" id="login-btn">Masuk</button>
        </form>

        <!-- Link kembali ke landing page (back-link di CSS) -->
        <a class="back-link" href="../landing/landing.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
          Kembali ke beranda
        </a>
      </div>
    </main>

    <footer>
      &copy; <span id="year"></span> placeholder
    </footer>

    <script src="pemimpin.js"></script>
  </body>
</html>
